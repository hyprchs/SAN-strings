[project]
name = "san_strings"
version = "0.1.0"
description = "Small lib for generating all possible Standard Algebraic Notation (SAN) chess move strings."
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "chess_action_space>=1.1.0",
]

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "mypy>=1.18.2",
    "ruff>=0.14.2",
    "uv-build>=0.9.5",
]

[tool.uv.sources]
chess_action_space = { path = "src/chess_action_space", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["san_strings"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Extend the default selected rules to include import sorting (I)
extend-select = ["I"]

[tool.mypy]
python_version = "3.13"
strict = false
incremental = false
#cache_dir = ".mypy_cache"
