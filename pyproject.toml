[project]
name = "san-strings"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "chess_action_space>=1.1.0",
]

[tool.uv.sources]
chess_action_space = { path = "src/chess_action_space", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.2",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Extend the default selected rules to include import sorting (I)
extend-select = ["I"]

[tool.mypy]
python_version = "3.13"
strict = false
incremental = true
cache_dir = ".mypy_cache"
